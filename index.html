<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Verifying your connection...</title>
  <meta http-equiv="refresh" content="3; url=https://open.iobeats.com/admin" />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      opacity: 0; /* start invisible for fade-in */
      animation: fadeIn 1.5s ease-in-out forwards;
      transition: opacity 1s ease-in-out;
      padding: 0 20px;
      text-align: center;
    }

    img {
      width: 220px;
      margin-bottom: 25px;
      animation: pulse 2s infinite;
    }

    h1 {
      font-weight: 600;
      font-size: 20px;
      color: #ff6600;
      letter-spacing: 0.5px;
      margin: 10px 0 5px;
    }

    h2 {
      font-weight: 400;
      font-size: 15px;
      color: #aaa;
      margin-top: 8px;
    }

    /* Logo pulse */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }

    /* Fade in and out */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(0.97); }
    }

    /* 🌍 Mobile optimization */
    @media (max-width: 600px) {
      img {
        width: 160px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 17px;
      }
      h2 {
        font-size: 13px;
      }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const userLang = navigator.language || navigator.userLanguage;
      const textEn = "Verifying your connection...";
      const textFr = "Vérification de votre connexion...";
      const subEn = "Redirecting to IO Beats platform";
      const subFr = "Redirection vers la plateforme IO Beats";

      const title = document.querySelector("title");
      const h1 = document.createElement("h1");
      const h2 = document.createElement("h2");
      const logo = document.createElement("img");

      // 🔗 IO Beats Logo
      logo.src = "https://raw.githubusercontent.com/iobeatss/iobeats-logo-assets/main/IOB_FullLogo_OrangeWhite.png";
      logo.alt = "IO Beats Logo";

      // 🌐 Langue auto
      if (userLang.startsWith("fr")) {
        title.textContent = textFr;
        h1.textContent = textFr;
        h2.textContent = subFr;
      } else {
        title.textContent = textEn;
        h1.textContent = textEn;
        h2.textContent = subEn;
      }

      document.body.appendChild(logo);
      document.body.appendChild(h1);
      document.body.appendChild(h2);

      // 🌙 Fade-out before redirect
      setTimeout(() => {
        document.body.style.animation = "fadeOut 1s forwards";
      }, 2000);
    });
  </script>
</head>
<body></body>
</html>
