name: Docs CI

on:
  push:
    branches: [ main ]
    paths:
      - "**/*.md"
      - "index.html"
      - ".github/workflows/docs-ci.yml"
      - ".markdownlint.json"
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.md"
      - "index.html"
      - ".github/workflows/docs-ci.yml"
      - ".markdownlint.json"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for markdownlint-cli2)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Markdown Lint -----------------------------------------------------
      - name: Markdown Lint
        run: npx markdownlint-cli2 "**/*.md" "#node_modules" --config .markdownlint.json
        continue-on-error: true

      # --- Link Checker (lychee) ---------------------------------------------
      - name: Link Checker (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 8
            --exclude-mail
            --accept 200,204,206,429
            --retry-wait-time 2
            --timeout 20
            .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # --- Codespell ---------------------------------------------------------
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          ignore_words_file: .codespellignore.txt
          skip: "node_modules,dist,build,.git"
        continue-on-error: true
